name: Technology profile request
description: Propose reusable guidance for an ecosystem such as Python, Go, or Docker.
title: "[Profile]: "
labels:
  - profile
body:
  - type: markdown
    attributes:
      value: Read CONTRIBUTING.md, AI_CONTRIBUTIONS.md, and profiles/README.md first. A maintainer must accept the profile scope before implementation; acceptance does not guarantee merge.
  - type: input
    id: ecosystem
    attributes:
      label: Ecosystem
      placeholder: Python packaging
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Cross-project scope
      description: Explain which recurring decisions the profile should specialize and what it should not own.
    validations:
      required: true
  - type: textarea
    id: projects
    attributes:
      label: Representative projects or scenarios
      description: Show that the guidance applies beyond one repository.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary official sources
      description: Link current ecosystem documentation, standards, or specifications.
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: Submission check
      options:
        - label: I searched existing issues and profiles for overlapping proposals.
          required: true
        - label: I read and understand this final submission, including any agent-assisted content.
          required: true
        - label: I removed credentials, private data, and confidential logs from this request.
          required: true
