name: Technology profile request
description: Propose reusable guidance for a technology-specific artifact or interface.
title: "[Profile]: "
labels:
  - profile
body:
  - type: markdown
    attributes:
      value: Read CONTRIBUTING.md, AI_CONTRIBUTIONS.md, and profiles/README.md first. A maintainer must accept the profile boundary before implementation; acceptance does not guarantee merge.
  - type: input
    id: artifact
    attributes:
      label: Technology or artifact
      placeholder: Python dependency manifests and lock files
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Recurring cross-project problem
      description: Describe the decisions or failures that recur across projects. Do not propose a general best-practice catalogue.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Proposed boundary
      description: Name the repository artifacts or interfaces the profile would own, the properties it would protect, material variants included or excluded, and only the adjacent boundary likely to be confused with it.
    validations:
      required: true
  - type: textarea
    id: activation
    attributes:
      label: Activation signals and false positives
      description: List observable repository signals, tasks that introduce or change the boundary, incidental lookalikes, and exclusions.
    validations:
      required: true
  - type: textarea
    id: outcomes
    attributes:
      label: Expected coverage
      description: List the observable outcomes the profile should protect. Detailed decisions and implementation are not required before scope acceptance.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Examples or evidence
      description: Provide concrete project shapes or examples showing that the problem recurs. Identify candidate official sources when the proposed boundary depends on a specification or tool contract. Completed research and validation are not required.
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: Submission check
      options:
        - label: I searched existing issues and profiles for overlapping proposals.
          required: true
        - label: I read and understand this final submission, including any agent-assisted content.
          required: true
        - label: I removed credentials, private data, and confidential logs from this request.
          required: true
